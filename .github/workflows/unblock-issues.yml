name: Unblock issues

# When an issue closes (usually because a pull request saying "Closes #n" was merged),
# look at every open issue labelled "blocked". If all the issues in its
# "depends on:" line are now closed, remove the "blocked" label and leave a comment.
# Can also be run by hand from the Actions tab.

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: unblock-issues
  cancel-in-progress: false

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Remove "blocked" where all dependencies are closed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const blockedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'blocked',
              per_page: 100,
            });

            for (const issue of blockedIssues) {
              if (issue.pull_request) continue;

              // Only read issue numbers that come after "depends on:" on that line,
              // so "can run alongside #4–#8" on the same line is ignored.
              const line = (issue.body || '')
                .split('\n')
                .find((l) => /depends on:/i.test(l));
              if (!line) {
                core.info(`#${issue.number}: no "depends on:" line, skipping`);
                continue;
              }
              const afterDependsOn = line.slice(line.toLowerCase().indexOf('depends on:'));
              const deps = [...afterDependsOn.matchAll(/#(\d+)/g)].map((m) => Number(m[1]));
              if (deps.length === 0) continue;

              const states = await Promise.all(
                deps.map((n) =>
                  github.rest.issues
                    .get({ owner, repo, issue_number: n })
                    .then((r) => r.data.state),
                ),
              );

              const stillOpen = deps.filter((_, i) => states[i] !== 'closed');
              if (stillOpen.length > 0) {
                core.info(`#${issue.number}: still waiting on ${stillOpen.map((n) => '#' + n).join(', ')}`);
                continue;
              }

              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue.number,
                name: 'blocked',
              });
              const list = deps.map((n) => '#' + n).join(', ');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Unblocked automatically: ${list} ${deps.length === 1 ? 'is' : 'are all'} closed. Ready to start.`,
              });
              core.info(`#${issue.number}: unblocked`);
            }
